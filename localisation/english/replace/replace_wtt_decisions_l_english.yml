l_english:
 form_spqr_italy_required_states_tt:0 "Controls all §YItalian§! states in Europe and North Africa."
 form_roman_empire:0 "Realize Roman Ambitions"
 form_arabia:0 "Unite Arabia"
 form_majapahit_empire:0 "Re-form the Thalassocracy"
 form_arabia_category:0 "Unite Arabia"
 form_majapahit_empire_category:0 "Re-form the Thalassocracy"
 form_majapahit_empire_category_desc:0 "Many centuries ago, a great empire stretched the Indonesian archipelago and dominated its trade. We have succeeded in expanding our borders to encompass the extent of this empire, and its recreation may well serve as a symbol of the region's unity."
 form_hre_category_desc:0 "The splendor of our Kaiserin knows no bounds, and neither do the borders of our nation. These have now grown to encompass the limits of the old Holy Roman Empire, and the nations in our way are no longer in a position to object to our policies. The Kaiserin has decreed that the current opportunity shall be seized, and that the nation shall embrace its role as the spiritual successor of the Holy Roman Empire. Aquila Elegit Iovis Omnia Vincit!"
 form_greater_german_reich_category:0 "Proclaim Greater German Reich"
 form_greater_german_reich:0 "Proclaim Greater German Reich"
 SOV_relocate_industry_from_leningrad_tt:0 "§RThese effects require control of Leningrad when the decision times out.§!"
 GER_reichskommissariats:0 "Reichskommissariats"
 GER_reichskommissariats_desc:0 "Enables creation of certain Reichskommissariat subjects out of controlled territory.\n\n"
 emergency_factory_conversion_offensive_desc:0 "The our troops urgently need more equipment. More factories are needed to produce the equipment required to win the war."
 GER_barbarossa_mission_desc:0 ""The German Armed Forces must be prepared to crush Soviet Russia in a rapid campaign. The bulk of the Russian Army will be destroyed by daring operations led by armored spearheads.""
 GER_case_anton_tt2:1 "Does not control any French states in North Africa."
 special_projects:0 "Special Projects"
 CHI_xian_fired:0 "Chinese Leaders invited to Xi'an"
 JAP_sue_for_peace_CHI_desc:0 "We have lost our hold on the mainland. The Military thinks it is unlikely that we will be able to recover the lost territories. The civilian government suggests that we should seek terms to at least keep our soverignity over the islands."
 JAP_sue_for_peace_MAN_desc:0 "We have lost our hold on the mainland. The Military thinks it is unlikely that we will be able to recover the lost territories. The civilian government suggests that we should seek terms to at least keep our sovereignity over the islands."
 JAP_war_with_soviet_union:0 "Declare War on Soviet Union"
 JAP_war_with_soviet_union_desc:0 "Our allies in Europe have signed a non-aggression pact with the Soviet Union. However, our war cannot wait; we must unilaterally pursue a conflict with the Communists, even if it risks alienating our allies."
 develop_singapore_aluminium_deposits:0 "Develop Singapore Bauxite Deposits"
 SOV_hold_stalingrad:0 "Hold Stalingrad"
 SOV_hold_leningrad:0 "Hold Leningrad"
 SOV_hold_moscow:0 "Hold Moscow"
 JAP_test_the_soviets_desc:0 "We share a long border with [SOV.GetNameDef] in Korea and Manchuria. A large number of potential flashpoints exist where our forces might clash at any moment. For us, this creates an opportunity to test the Soviet response to a minor provocation."
 JAP_border_incident_forgotten_desc:1 "If we want to use the the incident at the Soviet border to Korea, we must strike quickly."
 JAP_border_conflict_escalate_conflict_desc:0 "The conflict at the border with the Soviet Union has stalled. Perhaps by escalating further and commiting more troops to the theater, we can still achieve a victory."
