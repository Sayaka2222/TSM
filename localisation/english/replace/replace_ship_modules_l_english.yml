l_english:
 ship_light_battery_2_desc:0 "A small gun with a powered mount to allow the gun to get on target quickly."
 ship_light_battery_3_desc:0 "A small gun with gunshields to protect the crew from flying splinters and harsh weather."
 dp_light_battery_2_desc:1 "A small gun with a high angle gunshield, allowing it to engage airplanes as well as surface targets."
 dp_light_battery_3_desc:1 "A small gun high angle enclosed turret, allowing it to engage airplanes as well as surface targets."
 dp_light_battery_4_desc:0 "A small gun in a high angle powered turret, allowing it to engage airplanes as well as surface targets."
 ship_super_heavy_battery_1:0 "18.1" Cannon"
 ship_super_heavy_battery_1_short:0 "18.1" Battery"
 ship_super_heavy_battery_1_desc:0 "The largest naval gun ever put to sea. Delivers absurd penetration and catastrophic damage per hit, but at immense cost: crippling weight, very slow handling, brutal barrel wear, and massive strain on ship design and industry."
 ship_light_medium_battery_2_desc:0 "This gun represent a logical evolution from previous models, and is intended to allow light cruisers to have a comfortable advantage in firepower over destroyers and older cruisers."
 ship_anti_air_3_desc:0 "Previous calibers of guns have proven too light to reliably kill an attacking airplane before they can release their ordinance. A larger shell requires a bigger gun, but has a significantly higher chance of destroying the target when they actually hit."
 ship_radar_3:0 "Centrimetric Gunnery Radar"
 light_ship_engine_1_desc:0 "A small set of steam turbines can propell a small ship at great speed or power a larger ship at slower speeds."
