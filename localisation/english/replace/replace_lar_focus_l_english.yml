l_english:
 SPA_absorb_the_portuguese_empire_desc:1 "The Portuguese colonial empire is a part of our new Iberian hegemony, even if they might not yet see it that way. This is easily remedied."
 SPA_the_army_of_africa:0 "Lessons of the Civil War"
 SPA_settle_the_succession_question_desc:1 "The Carlist cause is split between camps supporting diffent claims to the throne. Alfonso Carlos, the Carlist heir, died without issue late 1936, but not before appointing Xavier of Bourbon-Parma as his heir. However, there are whose who instead support the claim of the old exiled constitutional king Alfonso XIII."
 SPA_a_fleet_worthy_of_a_king_desc:1 "Our navy must be greatly expanded if the monarch is to be able to assert his will across the oceans. New naval infrastructure shall be build forthwith."
 SPR_anti_fascist_unity_tt:0 "Unlocks §YAnti-Fascist Unit§! decisions, making it possible to delay the Anarchist uprising in return for concessions.\n"
 SPR_subvert_soviet_control_tt:0 "\n§R[SOV.GetNameDefCap] is likely to take action as a result of our disobedience!§!\n"
 FRA_invest_in_indochina:0 "Invest In Madagascar"
 FRA_invest_in_indochina_desc:0 "The long distance between our holdings in Madagascar and our heartland may seem like a drawback, but it also protects any industry there from enemy attack."
 FRA_invest_in_syria:0 "Invest In Cameroon"
 FRA_invest_in_syria_desc:0 "Cameroon is perfectly positioned to supply us in case of a war in Europe or Africa. Enhancing its industrial potential will also support our position in the area."
 FRA_franco_soviet_treaty:0 "Franco-Soviet Treaty"
 FRA_franco_soviet_treaty_desc:0 "The Soviets are just as worried about the rise of fascism in Europe as we are. Perhaps we could convince them to support us if the time came."
 FRA_economic_devolution_desc:0 "It is absurd to think that some bureaucrat in Paris knows what is best for a company in Bordeaux. We must trust our entrepeneurs and empower them to create their own solutions."
 FRA_promote_entrepeneurship:0 "Promote Entrepeneurship"
 FRA_national_regeneration_desc:0 "An excess of democracy and misguided republicanism have poisoned our country and divided our people. It will take a long time to heal these wounds, but at ast the first steps have been taken."
 FRA_fatherland_desc:0 "The country stands above all else. There can be no doubt about this."
 FRA_compensate_italy_desc:0 "In the past, conflicts over some tiny stretches of desert have drawn our nations into conflict. Such nonsense is easily stopped, and a mutually agreeable outome can quickly be found."
 FRA_revise_the_constitution_desc:0 "The republican constitution was alwas intended to be a stopgap measure that has been allowed to persist for far too long. Now, we will rewrite it to allow a monarch to return."
 FRA_counter_action_desc:0 "The Action Francaise has long been the strongest advocate for a return to the monarchy. Unfortunately, their views on other subjects are less palatable. It is time to inform them that they have served their purpose and dispose of them."
 VIC_modernize_the_airforce:0 "Modernize the Airforce"
 FRA_appeal_to_overseas_territories_tt:0 "§RMake sure you have a variant of Mechanized, Medium Tanks, SPGs and TDs, otherwise you get nothing.§!"
 FRA_the_maquis_desc:1 "The rural areas of France offer cover for anyone who wishes to escape from the occupier or their collaboratist lackeys. We should support the people who deny their labour to the enemy in an act of resistance, so that we may in time turn those areas into hotbeds of resistance."
 FRA_connections_to_industrialists_desc:0 "While cooperation with the workers in the war industries help, cooperating with the people who run the factories has benefits in and of itself."
 POR_infrastructure_in_angola_tt:0 "Add §Y2 Naval Base§! in Namibe province in Angola.\n   Add §Y3 Naval Base§! in Luanda province in Angola.\n"
 POR_air_naval_research_desc:0 "We must gather our best pilots and naval officers to devise new ways of coordinating our increasing airforce and navy."
 POR_atlantic_defense_strategy_desc:0 "Our islands, isolated in the middle of the ocean, can easily be taken one by one. With the right investements, however, they can be turned into unsinkable aircraft carriers!"
 POR_assist_the_requetes_desc:0 "Several members of the Portuguese army and airforce will be sent to Spain to oversee the war efforts of the Carlists and advise their leaders. While they are there, they will also gather information about the battle tactics used by each side."
 FRA_laissez_faire_tt:0 "Our economy will become more efficient after a period of about a year."
