l_english:
 MEX_focus_confederation_of_mexican_workers_desc:0 "The political elite in Mexico have alway sought to control trades union activities. The CTM will replace the CROM, as the latter is seen as corrupt and discredited by association with unpopular past leaders of the regime."
 MEX_focus_royal_dutch_shell_desc:0 "Royal Dutch Shell is a British and Dutch firm holding 60% of Mexican oil concessions. By compromising with the foreign oil companies on the matter of labor disputes, we can come to an accomodation that is beneficial to us both."
 MEX_focus_purchase_belize_desc:0 "This small territory was long claimed by the Spanish crown in colonial times, though never settled by peninsulares. After the loss of Spain's colonial empire during the Napoleonic Wars, Britain gradually solidifed a hold on the territory, culminating in the creation of the colony of British Honduras in 1862. The territory ought to be turned over to Mexico as a gesture of good faith."
 MEX_focus_depoliticised_army_desc:0 "The generals have no right to the allegience of their soldiers. The ultimate source of legitimacy is the Mexican state. We should prevent the generals entertaining any thoughts of rebellion by rotating them between provinces so that they cannot build up patronage networks or secure the personal loyalty of their soldiers."
 MEX_focus_professional_army:0 "Professional Army"
 MEX_focus_professional_army_desc:0 "We cannot rely on ad hoc soldaderas to provision the troops in the field. We need supply depots and a logistics corps. We would like to use motor trucks and railways, but even donkeys would be an improvement over leaving the troops to forage supplies for themselves."
 MEX_focus_the_gold_shirts_desc:0 "General Nicolás Rodríguez Carrasco formed the Gold Shirts in 1933 to defeat communist traitors working against the government. The paramiliatary group should become a wing of the government as their goal is admirable and their methods necessary."
 MEX_focus_liberate_the_caribbean_desc:1 "Like the rest of Latin America, the Caribbean states were ruthlessly exploited by European imperialists before throwing off their shackles. Though still weak, these states deserve our protecction. Mexico's national pride demands that we secure the Caribbean to prevent its exploitation by imperialists!"
 MEX_focus_realpolitik_desc:1 "We have our ideological convictions, but Mexico as a state has her own interests divorced from the international struggle. We need to tred a careful path in the turbulent times ahead. One wrong move could bring the full weight of would-be imperialists and tyrants down on our heads."
 ENG_special_air_service_desc:1 "An officer by the name of David Stirling has come up with the idea that a small commando unit might be capable of harrassing the enemy behind their lines, causing tremendous damage. Naming them an 'Air Service' has the added benefit of causing the enemy to believe they have to defend against paratroopers, too. There may well be merit to this idea."
 ENG_revisit_colonial_policy_desc:1 "The times are changing. It is clear that independence movements will only continue to spring up across the empire, and in ever-stronger incarnations. If we do not wish to be forced into pouring increasingly vast resources into surpressing these movements, then we must acknowledge that our Empire has run its course, and now must be allowed to find its own path into the world."
 ENG_withdraw_from_contested_territories_desc:0 "A number of territories across the globe, considered part of the British Overseas Territories, are claimed by neighboring states. This causes diplomatic tensions, and so it may be better to reassess their status as under United Kingdom juristiction."
 ENG_steady_as_she_goes:1 "Carry On, Britain"
 ENG_global_defense:1 "The Defense of the Realm"
 ENG_motion_of_no_confidence:1 "The Fall of Appeasement"
 ENG_prepare_for_the_inevitable:1 "Britain Must Be Ready"
 ENG_the_one_true_revolution_desc:1 "No cooperation will ever be possible with Moscow. Corruption is rife in [SOV.GetNameDef], and the only hope is to cut out its heart and assume undisputed global leadership of the Worker's Cause."
 ENG_follow_moscow:1 "Follow Moscow"
 ENG_follow_moscow_desc:1 "In its roots, communism in Britain has always followed the orders of Moscow. To continue to do so now is not only logical, but also necessary. Between the Red Army and our Navy, we shall spread the word of Marx far and wide, and none can stop us."
 ENG_bermuda_invasion_launch_point_desc:1 "An invasion of North America will not be an easy task. We must build up our possessions in Bermuda to be able to accomodate the invasion force for such a duration of time as is necessary, before it can then be sent to spread the Revolution directly to American shores."
 ENG_indian_autonomy_tt:0 "§RWithout autonomy, [RAJ.GetNameDef] will not accept any proposals for Imperial Federation.§!"
 ENG_vanguard:0 "§CHMS Lion§!"
 ENG_vanguard_desc:0 "We must not be outnumbered by our enemies on the seas. We have a number of 16-inch guns still in storage that could be used to replace the time-consuming 16-inch guns required for our next planned battleships, which would greatly speed up construction of the class's lead ship: HMS Lion."
 ENG_VANGUARD_DESC_HISTORICAL:0 "We must not be outnumbered by our enemies on the seas. We have a number of 16-inch guns still in storage that could be used to replace the time-consuming 16-inch guns required for our next planned battleships, which would greatly speed up construction of the class's lead ship: HMS Lion."
 HOL_java_desc:0 "Tha capital island of our East Indies should be heavily invested into, so that we bring it more in line with the proper degree of industrialisation for the day."
 HOL_affirm_loyalty_to_moscow:0 "Affirm Loyalty To Moscow"
 HOL_affirm_loyalty_to_moscow_desc:0 "Our party has long taken its instructions from Moscow, and it is only natural that we will join them in their plight to spread communism across the globe."
