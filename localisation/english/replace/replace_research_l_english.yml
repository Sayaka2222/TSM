 air_doctrine_folder_desc:0 "Air doctrine, how your Airforce fights."
 improved_equipment_conversion:0 "Improved Equipment Conversion"
 improved_equipment_conversion_desc:0 "Advancements in engineering allow us to fix the issues we found in previous models and update them to fit our current needs."
 advanced_equipment_conversion:0 "Advanced Equipment Conversion"
 advanced_equipment_conversion_desc:0 "Setting up specialized teams and assembly lines for retrofitting our outdated models will keep our war machine deadly at all times."
 modern_oil_processing_desc:1 "Our oil refinineries can be further improved with new advanced oil processing methods like hydrocracking, alkylation, mercaptan oxidation and isomerization."
 advanced_rubber_processing_desc:1 "A general purpose synthetic rubber recepie with improved processes such as dodecyl mercaptan polymerization modifiers will allow us to expand synthetic rubber production."
 radio_detection:0 "Radio Detection"
 interwar_artillery:0 "Interwar Artillery"
 mountain_gun_desc:0 "The mountainous terrain of Northern India led to the development of an artillery piece that could be dismantled and carried on muleback to wherever it was needed."
 antiair1:0 "Anti-Air II"
 antiair1_desc:0 "To target high-flying aircraft, longer cartridges and barrels will be needed on anti-air guns."
 antiair2:0 "Improved Rapid Fire"
 antiair2_desc:0 "With faster reloading mechanisms, anti-air guns carrying large rounds can still maintain necessary firing rates."
 antiair3:0 "Improved Range"
 antitank2:0 "Improved Cartriges"
 antitank3:0 "HEAT Ammunition"
 antitank4:0 "APDS Ammunition"
 escort_carriers_desc:0 "The area covered by a Carrier aircrafts makes escorting trade convoys a much easier task. Securing the flow of resources is essential."
 carrier_battlegroups_desc:0 "Carriers are able to strike at the enemy from a greater distance than any naval cannon and with eyes in the sky we will never be caught off guard. Carriers in mass is a force to be reckoned with."
 ca_tech:1 "Heavy Cruiser models"
 JET_ENGINES_RESEARCHED:0 "Allows researching technologies that require Jet Engines, such as jet aircrafts"
 degaussing_desc:0 "By installing powerful electro-magnetic coils, a ship's magentic signature can be dramatically reduced, making it far less vulnerable to magnetic mines."
 coastal_defense_ships:0 "Frigate"
 advanced_sonar:0 "Sonobuoys"
 advanced_sonar_desc:1 "Series of sonar buoys allow us to triangulate submarines much more effectively.\n\nMounting this module in an §YElectronics Slot§! on §YLight Ships§! or §YCruisers§! will help them detect enemy §YSubmarines§!."
 homing_torpedo_desc:0 "Equipped with an accoustic detector, the torpedo can home in on the biggest source of noise ahead of it - usually the target."
 basic_submarine_snorkel_desc:1 "A simple airtube running from the engine room to the control tower. Extended, it allows the submarine to run its engines and charge its engines while still submerged.\n\nMounting this module on §YSubmarines§! reduces their §YVisibility§!, making them harder to detect."
 improved_submarine_snorkel_desc:1 "An improved design prevents any water from being sucked into the engines and also reduces the radar echo of the snorkel head.\n\nMounting this module on §YSubmarines§! reduces their §YVisibility§!, making them harder to detect."
