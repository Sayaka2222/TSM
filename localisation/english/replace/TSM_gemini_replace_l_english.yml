 GRAND_DOCTRINE_MOBILE_WARFARE_DESC:0 "Speed, breakthrough, and operational tempo.\n§GGrand Doctrine Mastery Synergy:§! +15% Armor & Motorized Track Mastery Gain.\n§YSupport Companies Track Milestone:§! Allows §YAssault Gun§! regimental support for Infantry & Mobile Infantry regiments."
 GRAND_DOCTRINE_SUPERIOR_FIREPOWER_DESC:0 "Overwhelming combined-arms lethality and fire support.\n§GGrand Doctrine Mastery Synergy:§! +15% Combat Support & Support Track Mastery Gain.\n§YSupport Companies Track Milestone:§! Allows §YSelf-Propelled Artillery§! regimental support for Infantry & Mobile Infantry regiments."
 GRAND_DOCTRINE_GRAND_BATTLEPLAN_DESC:0 "Methodical planning, night attacks, entrenchment, and terrain mastery.\n§GGrand Doctrine Mastery Synergy:§! +15% Operations & Infantry Track Mastery Gain.\n§YSupport Companies Track Milestone:§! Allows §YHeavy Tank Detachment§! regimental support for Infantry & Mobile Infantry regiments (requires Heavy Tank 1)."
 GRAND_DOCTRINE_MASS_ASSAULT_DESC:0 "Deep operational depth, relentless recovery, supply efficiency, and massed tank waves.\n§GGrand Doctrine Mastery Synergy:§! +15% Infantry & Armor Track Mastery Gain.\n§YSupport Companies Track Milestone:§! Allows §YSupport Motorized Rocket Artillery§! (Katyusha) regimental support for Infantry & Mobile Infantry regiments."
 GRAND_DOCTRINE_STRATEGIC_DESTRUCTION_DESC:0 "§RReserved for Major Powers only.§! Long-range air supremacy, bomber escort, and strategic devastation.\n§GGrand Doctrine Mastery Synergy:§! +15% Heavy & Medium Aircraft Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Fighters: Interceptor Wall, Escort Fighters, Homeland Defense\n- Strike: Naval Strike Tactics, Flexible Fire Support\n- Medium: Long-Range Escort, Bomber Interception\n- Heavy: Long-Range Maritime Patrol, Carpet Bombing, Flying Fortresses, Deep Air Raids"
 GRAND_DOCTRINE_BATTLEFIELD_SUPPORT_DESC:0 "§RReserved for Major Powers only.§! Close air support and tactical air-ground domination.\n§GGrand Doctrine Mastery Synergy:§! +15% Strike & Medium Aircraft Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Fighters: Tactical Flexibility, Fighter-Bombers\n- Strike: Armored Column Hunters, Flying Artillery, Dive Bombers, Carrier Strikes\n- Medium: Night Intruder Wings, Tactical Battlefield Support, Operational Air Support\n- Heavy: Coastal Air Patrol, Night Bombing"
 GRAND_DOCTRINE_OPERATIONAL_INTEGRITY_DESC:0 "§RReserved for Major Powers only.§! Agile fighter dominance, ace generation, and flexible operational interdiction.\n§GGrand Doctrine Mastery Synergy:§! +15% Fighter & Strike Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Fighters: Interceptor Wall, Dogfighting Mastery, Naval Fighter Control\n- Strike: Flexible Fire Support, Naval Torpedo Tactics, Carrier Strikes\n- Medium: Night Intruder Wings, Theater Interdiction, Aerial Reconnaissance\n- Heavy: Open Ocean Air Patrol, Heavy Aircraft Focus, Night Bombing"
 GRAND_DOCTRINE_FLEET_IN_BEING_DESC:0 "Heavily armored battlelines, convoy escorts, and anti-submarine control.\n§GGrand Doctrine Mastery Synergy:§! +15% Capital Ships & Screens Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Capital: Line of Battle (§GExclusive§!), Battleship AA Screen, Naval Gunfire Support\n- Carriers: Escort Carrier Hunters, Floating Airfields, Carrier Battlegroups\n- Screens: Convoy Escort (§GExclusive§!), Hunter-Killers (§GExclusive§!), AA Cruisers\n- Submarines: Littoral Ambush Submarines, Submarine Fleet Operations, Coastal Defense"
 GRAND_DOCTRINE_CONVOY_RAIDING_DESC:0 "Wolfpacks, fast surface raiders, and torpedo ambushes.\n§GGrand Doctrine Mastery Synergy:§! +15% Submarines & Screens Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Capital: Fast Surface Flotillas, Armored Raiders, Battlecruiser Supremacy\n- Carriers: Light Task Forces, Floating Airfields\n- Screens: Night Torpedo Flotillas, Torpedo Primacy, Integrated Operations\n- Submarines: Littoral Ambush Submarines, Wolfpacks, Capital Hunters (§GExclusive§!)"
 GRAND_DOCTRINE_BASE_STRIKE_DESC:0 "Massed carrier task forces, sortie tempo, and fast strike screens.\n§GGrand Doctrine Mastery Synergy:§! +15% Carriers & Screens Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Capital: Battlecruiser Supremacy, Battleship AA Screen, Naval Gunfire Support\n- Carriers: Massed Carrier Fleet (§GExclusive§!), Escort Carrier Hunters, Carrier Battlegroups\n- Screens: Night Torpedo Flotillas, Integrated Operations, Torpedo Primacy, AA Cruisers\n- Submarines: Submarine Fleet Operations, Wolfpacks"
