l_english:
 royal_ordinance_focus:2 "Royal Ordnance Factories"
 royal_ordinance_focus_desc:1 "The Royal Arsenal at Woolwich is woefully insufficient to produce all the munitions and small arms we need. We should establish many more factories around the country, preferably in relatively safe areas."
 shadow_scheme_focus:0 "§YInitiate Shadow Scheme§!"
 shadow_scheme_focus_tt:1 "Grants §G1§! Building Slot and §Y1 Military Factory§! for every §Y3 Civilian Factories§! built after completing this focus when completing the Shadow Scheme.\nThe maximum number of §YMilitary Factories§! we can cover up is §GInfinite§!. "
 uk_small_arms_focus_desc:1 "The Royal Ordnance Factories are not producing enough small arms, but, like we did in the Great War, we could contract the Birmingham Small Arms Company and expand their capacity."
 air_rearmament_focus_desc:1 "In any war with a continental enemy, the Royal Air Force will prove the key to victory. First, we must ensure that our airbases can support our rearmament plans!"
 coastal_command_focus_desc:1 "Our industry is driven by resources shipped to Britain from many distant parts of the Empire. Our convoys are our lifeblood and must be protected by both the Royal Navy and the Royal Air Force. We should set up a special RAF formation to protect the approaches to our ports!"
 uk_jet_focus:0 "Spitfire Griffon"
 uk_jet_focus_desc:0 "We have to keep up with the enemy in the air, therefore our planes should be fitted with the newest state of the art engines."
 naval_rearmament_focus_desc:1 "Though we tried to prevent a naval arms race with the Second London Naval Treaty, even the signatories are mostly ignoring it. The Royal Navy must never lose its global supremacy. We must always ensure that it remains the largest in the world."
 uk_waves_focus:0 "§CBritannia Rules the Waves§!"
 uk_waves_focus_desc:1 "In the long shadow of the Royal Navy, other naval powers are forced to come up with innovative new doctrines to compensate. We must not grow complacent and rely solely on the quantity and quality of individual ships."
 uk_colonial_focus:0 "Rule Through Responsibility"
 SUBDOCTRINE_GREAT_WAR_INFANTRY:0 "Defense in Depth"
 DOCTRINE_TRACK_COMBAT_SUPPORT:0 "Artillery"
