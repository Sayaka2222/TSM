l_english:
 ITA_fortification_effort:0 "Alpine Wall"
 ITA_slovenia_dalmatia_claims:0 "Steel Pact"
 ITA_pact_of_steel:0 "Albanian Occupation"
 ITA_pact_of_steel_desc:0 "Albania paints an easy target for our troops to occupy. We are unlikely to be met with much resistance. We must show the world the might of Italy and restore the glory of the Roman Empire!"
 ITA_italy_first_desc:0 "Mussolini will never play second fiddle to Hitler! We must heed the lessons of the Roman Empire; Teutonic interference in Italian affairs never ends well..."
 ITA_romania_friend:0 "Blackshirts"
 ITA_romania_friend_desc:0 "Milizia Volontaria per la Sicurezza Nazionale"
 ITA_german_rd_treaty:0 "Pact of Steel"
 ITA_libyan_refineries:0 "Italian Refineries"
 ITA_libyan_refineries_desc:0 "Italy is a perfect place for constructing refineries. Close to oil sources and close to production in the homeland."
 ITA_prospect_for_oil:0 "Prospect For Oil"
 ITA_prospect_for_oil_desc:0 "Old empires always fear new ones on the rise and we should not depend on them. We cannot rely on oil from other nations and should focus our efforts on finding our own source within the empire. This is how we make sure to stay competitive far into the future."
 ITA_greece_war_goal:0 "Balkan Dominance"
 ITA_greece_war_goal_desc:0 "What kind of Roman Empire are we restoring if we do not include Greece and Yugoslavia? They should be easy targets..."
