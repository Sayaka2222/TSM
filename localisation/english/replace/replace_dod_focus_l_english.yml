l_english:
 HUN_rapproachement_with_little_entente_desc:0 "Hostile ideologies surround us, and we must re-affirm our ties to our Little Entente neighbors. We will ask them if they wish to see us rearm."
 HUN_announce_the_gyor_program:0 "Announce the Györ Program"
 HUN_expand_the_aluminum_industry:0 "Expand the Mining Industry"
 HUN_assault_gun_focus_desc:0 "Rather than focus on full-fledged tanks, we will instead rely on assault guns to air our infantry in affecting break-throughs, as a more cost-effective alternative."
 HUN_light_infantry_divisions_doctrine_tech_tt:0 "Enables §HLight Infantry Divisions Doctrine§!\n Recruitable Population: §Y3.00%§!\n §HInfantry\n    Forest§!\n        Movement: §G+5%§!\n    §HUrban§!\n        Movement: §G+5%§!\n"
 HUN_light_infantry_divisions_doctrine_unit_tt:0 "\nGain a §YInfantry§! unit with 6 battalions.\n"
 HUN_reform_desc:0 "It makes little sense to create a navy built around outdated ideas. We have been give the opportunity to create a new navy from scratch, without the baggage of the old. We should use it to build the most modern and capable navy we can."
 HUN_submarines_desc:0 "Submarines came close to beating the most powerful navy on the planet in the last war. We can not be taken seriously as a modern navy if we do not posess submarines of our own."
 fighter_tt:0 "Must have a modern fighter to offer and be at peace with [Root.GetName]"
 bomber_tt:0 "Must have a modern bomber to offer and be at peace with [Root.GetName]"
 ROM_a_deal_with_the_devil_desc:0 "Communism threatens our eastern border, and territorial demands may only be just over the horizon. Perhaps it would be better to join the Soviets rather than fight them."
 ROM_form_peasant_militias_desc:0 "With the communist ideals that we take from our neighbor comes the duty of every man to defend his comrades, his country, and the revolution."
 ROM_basing_rights_for_soviet_union:0 "Basing Rights for Soviet Union"
 ROM_basing_rights_for_soviet_union_desc:0 "We know the Soviets desire our territory, but we might be able to preclude any hostilities by offering our neighbor basing rights."
 ROM_license_german_equipment:0 "Invite Opel"
 ROM_renew_the_romanian_polish_alliance_desc:0 "Our old ties with Poland have cooled in recent years. As the threats surrounding us have not diminished, and the global political situation grows ever more tumultuous, the time has come to revive our alliance with our northern neighbor."
 ROM_the_cordon_sanitaire_desc:0 "We are bordered by dangerous ideologies both to the east and to the west. Together with our neighbors to the north and south, we will establish a barrier, quarantining these dogmas and preventing them from advancing any further."
 ROM_invest_in_the_iar_desc:0 "It is critical to keep up with the demands of a modern airforce. Our industry must be capable not only of building the machines we require in the first place, but also of doing so at a pace fast enough to replace operational losses."
 ROM_divide_yugoslavia_desc:0 "The current arrangement of the Balkan states making up Yugoslavia is not maintainable. We will issue an ultimatum requiring a restructuring of their component states, under Romanian leadership."
 ROM_appoint_soviet_friendly_government_desc:0 "The future of Romania hinges on good relations with our communist eastern neighbor. We must appoint a government that understands this reality."
 ROM_appoint_german_friendly_government_tooltip:0 "Removes §YConstitutional Guarantees§! and §YSecuritate§!\n"
 ROM_appoint_allied_friendly_government_tooltip:0 "Removes §YIron Guard§! and §YSecuritate§!\n"
 ROM_appoint_soviet_friendly_government_tooltip:0 "Removes §YConstitutional Guarantees§! and §YIron Guard§!\n"
 ROM_constitutional_guarantees_desc:0 "The constitutional chances that have been implemented by the King must be reverted, and guarantees and balances must be introduced to ensure this does not happen again. Otherwise, all we are left with is a mockery of democracy."
 ROM_heavy_interceptors_desc:1 "Our country can not support a large airforce. We must concentrate as much firepower as possible in each plane to destroy any attacker."
 ROM_the_armored_division_tt:0 "Gain a unit with §Y4 Medium Armor§! and §Y4 Motorized§! battalions.\n"
 CZE_fallback_line:0 "Fallback Line"
 CZE_hungarian_line:0 "Hungarian Line"
 CZE_polish_line:0 "Polish Line"
 CZE_industrial_legacy:0 "Industrial Legacy"
 CZE_balanced_3:1 "Local Specialization"
 CZE_political_direction:0 "Political Direction"
 CZE_go_left:0 "Go Left"
 CZE_join_comintern:0 "Join Comintern"
 CZE_go_right:0 "Go Right"
 CZE_aggressive_wars:0 "Aggressive Wars"
 CZE_german_minor_ally:0 "German Ally"
 CZE_german_ally:0 "German Partner"
 CZE_german_puppet:0 "German Puppet"
 CZE_deliver_sudetenland:0 "Deliver Sudetenland"
 CZE_security_council:0 "Security Council"
 CZE_deal_with_hungary:0 "Dissolve Hungary"
 CZE_czechoslovak_legion:0 "Czechoslovak Legion"
 CZE_doctrine_bonus_2:0 "Doctrine Discoveries II"
 CZE_doctrine_bonus_2_desc:0 "Weapons alone do not make an army potent, effectives doctrines are also required. The Military Technical Institute is well aware of this and has offered several suggestions."
 CZE_rule_the_air:0 "Rule the Air"
 YUG_join_axis:0 "Join the Axis"
 YUG_join_axis_desc:1 "The path to Yugoslavian greatness lies with the fascist powers of the Axis. If the military's anti-German sentiments have not been dealt with this may have severe repercussions, but that is a necessary sacrifice."
 YUG_limited_self_government_desc:1 "By placating the Slovenes with limited autonomy we can pull out the rug from under their nationalist movements and gain the support of the local population."
 YUG_join_allies:0 "Join the Allies"
 YUG_join_allies_desc:1 "In our fledgling nation's brief history the Western Democracies have always supported us. We must make our allegiance known in public, so that we may rely on their military strength should we become the target of our neighbors."
 YUG_reclaim_istria_and_zadar_desc:1 "Italy still holds the territories of Istria and Zandar. It is time to bring them home."
 YUG_yugoslavian_path_to_communism_desc:1 "We require no guidance in our fight for the workers' cause. We will gather those who accept our leadership, and together spread out version of the Revolution."
 YUG_invite_bulgaria_desc:1 "Our Slavic brethren in Bulgaria require our leadership to find their way to Communism. Furthermore, as they occupy our eastern flank, bringing them into the fold will allow us to stop worrying about a large section of our borders, and their military strength will be very useful in spreading the Revolution."
 YUG_exploit_the_pannonian_deposits_desc:1 "We should exploit the oil deposits that lie within our territory. Though the quantity is meager, we need all we can get for our war machine."
 YUG_anti_tank_defenses:0 "Anti-tank Defenses"
