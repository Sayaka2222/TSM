 NOR_submarine_4_desc:0 "KThe Utsira class consisted of four British Vampire-class submarines. They were built between 1943 and 1941, though only one was transferred to the Norwegian Navy in exile before the end of the war. The ships were only a moderate improvement over the preceding U-class. They displaced 545 tons, were armed with four 533mm torpedo tubes, and a diving depth of 90m."
 NOR_destroyer_4_desc:0 "The Stord class consisted of four British S-class destroyers built for the Royal Norwegian Navy in exile between 1943 and 1941. They displaced nearly 1,800 tons and were armed with four 120mm/45 QF Mk IX guns in their main armament, as well as eight 533mm torpedo tubes and a decent ASW and radar complement. They also had good speed and reliability as well."
 NZL_submarine_3_desc:0 "The U class were small-sized submarines built under the War Emergency 1939 and 1941 Programs. Originally designed as training submarines as the war broke out, the design changed, allowing these submarines to prove useful in the confined waters of the North Sea and the Mediterranean. Due to their smaller size, their range and the weaponry were limited. Three subclasses made up the class: Undine, Umpire and Uproar."
 NZL_light_cruiser_3_desc:0 "The Gambia class was the New Zeland designation for British Crown Colony-class light cruisers. These were improved versions of the earlier Town class but with a simplified design to speed up construction and reduce costs. The ships carried the same guns as their predecessors, four triple turrets housing 6 in. guns. They were similarly armored but because of their smaller engines, their range was somewhat reduced. The type included two subclasses: Fiji and Ceylon."
