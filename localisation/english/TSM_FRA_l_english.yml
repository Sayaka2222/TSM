l_english:
 FRA_doc_tt:0 "§R For every core State that has 4 or more civilian factories you get 2 offmap civilian factory §!"
 FRA_doc_tt_2:0 "§R For every core State that has 10 infrastructure you get 2 arms factories in that state §!"
 FRA_katyusha:0 "§RCrusade for Cherbourg§!"
 FRA_fortify_morocco:0 "Fortify Morocco"
 FRA_fortify_morocco_desc:0 "We must quickly set up defenses and build infrastructure in preparation for the coming battle"
 FRA_evacuation_to_morocco:0 "Evacuation to Cameroon"
 FRA_evacuation_to_morocco_desc:0 "The Battle of France is over - but not the war. We will fight on in Africa!"
 FRA_retreat_to_gabon:0 "Libreville"
 FRA_retreat_to_gabon_desc:0 "The Axis have proven to be more deft and powerful than we could have imagined, but this is merely a setback in the liberation of France. To Gabon!"
 FRA_invade_madagascar:0 "Invade Madagascar"
 FRA_madagascar_refuge_desc:0 "The retreat to Madagascar has forced Allied governments to supply us with resources to bulid up our base of operations, allowing us to continue to be impactful to the Allied war effort."
 FRA_retake_syria:0 "Retake Syria"
 FRA_retake_syria_desc:0 "Its time to add a localization."
 FRA_colonial_expansion:0 "Expand the African Colonies"
 FRA_colonial_expansion_desc:0 "Developing our colonies may upset the natives, but it will open up new opportunities for France."
 FRA_colonial_infrastructure:0 "Develop the Colonial Empire"
 FRA_colonial_infrastructure_desc:0 "In order for our colony economy to pay off we must build up our road and rail networks to efficiently extract resources."
 FRA_resources_for_the_allies:0 "Expand the Rubber Plantations"
 FRA_resources_for_the_allies_desc:0 "We must develop Madagascars rubber reserves for the war effort!"
 FRA_resources_for_the_allies_expanded:0 "Expand the Bauxite Mines"
 FRA_resources_for_the_allies_expanded_desc:0 "We must develop Malia's aluminium mines for the war effort!"
 FRA_resources_for_the_allies_expanded2:0 "Develop Mauritanian Iron Mines"
 FRA_resources_for_the_allies_expanded2_desc:0 "Mauritania is sitting on an untapped reserve of iron - we need steel for bullets and tanks"
 FRA_expand_the_chromium_mines:0 "Expand the Chromium Mines"
 FRA_expand_the_chromium_mines_desc:0 "Allied heavy tank production heavily uses Chromium - a resource we can produce much more of."
 FRA_preparing_dragoon:0 "Preparing Operation Dragoon"
 FRA_preparing_dragoon_desc:0 "We must build airfields in Algeria and Tunisia in preparation for liberating southern France."
 FRA_operation_dragoon:0 "Operation Dragoon"
 FRA_operation_dragoon_desc:0 "It is time to take back our fatherland!"
 FRA_preparing_husky:0 "Preparing Operation Husky"
 FRA_preparing_husky_desc:0 "Italy is the soft underbelly of Europe - we must exploit that."
 FRA_operation_husky:0 "Operation Husky"
 FRA_operation_husky_desc:0 "The liberation of France will happen through the invasion of Italy."
 FRA_lappel_du_18_juin:0 "Appeal of 18 June"
 FRA_lappel_du_18_juin_desc:0 "But has the last word been said? Must hope disappear? Is defeat final? No!"
 FRA_recruit_the_indigenes:0 "Recruit the Natives"
 FRA_recruit_the_indigenes_desc:0 "We must recruit the native population of Africa in order to avoid our army attritioning in the desert."
 FRA_felix_eboues_tour:0 "Félix Éboué's Tour"
 FRA_felix_eboues_tour_desc:0 "One of our colonial administrators, Félix Éboué, is crucial to building up our image and support among the Africans in our colonies."
 FRA_new_native_policy:0 "New Native Policy"
 FRA_new_native_policy_desc:0 "Our New Native Policy will radically change how we approach the indigenous populations of our colonies, leading towards better relations and more support for France when we need it."
