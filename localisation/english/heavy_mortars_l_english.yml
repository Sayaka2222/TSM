l_english:
 ARTILLERY_TITLE_HEAVY_MORTARS:0 "HEAVY MORTARS"

 heavy_mortars_1:0 "120mm Heavy Mortars"
 heavy_mortars_1_desc:0 "Large-caliber smoothbore mortars capable of lobbing heavy high-explosive bombs over obstacles directly in support of frontline infantry."
 heavy_mortars_2:0 "Improved Heavy Mortars"
 heavy_mortars_2_desc:0 "Wheeled regimental mortar carriages and strengthened baseplates allowing rapid redeployment and heavier sustained fire."
 heavy_mortars_3:0 "High-Angle Fire Control"
 heavy_mortars_3_desc:0 "Refined ballistic tables, forward observer triangulation, and specialized high-explosive mortar rounds that maximize lethality against entrenched defenders."
 heavy_mortars_4:0 "160mm Siege Mortars"
 heavy_mortars_4_desc:0 "Super-heavy breech-loading infantry mortars combining compact regimental transportability with devastating bunker-busting shell weight."
 heavy_mortars_5:0 "Rapid-Barrage Fuze Munitions"
 heavy_mortars_5_desc:0 "Airburst and variable-delay fuzes paired with streamlined mortar bombs for overwhelming regimental fire concentrations."

 heavy_mortar_equipment:0 "Heavy Mortars"
 heavy_mortar_equipment_short:0 "Hvy. Mortars"
 heavy_mortar_equipment_desc:0 "Heavy regimental mortars designed for high-angle indirect fire support against fortified and urban positions."
 heavy_mortar_equipment_1:0 "120mm Heavy Mortar"
 heavy_mortar_equipment_1_short:0 "Hvy. Mortar I"
 heavy_mortar_equipment_1_desc:0 "A robust 120mm heavy infantry mortar bridging the gap between company light mortars and divisional artillery."
 heavy_mortar_equipment_2:0 "Improved 120mm Mortar"
 heavy_mortar_equipment_2_short:0 "Hvy. Mortar II"
 heavy_mortar_equipment_2_desc:0 "A towed 120mm regimental mortar with improved range, recoil stability, and rate of fire."
 heavy_mortar_equipment_3:0 "160mm Heavy Mortar"
 heavy_mortar_equipment_3_short:0 "Hvy. Mortar III"
 heavy_mortar_equipment_3_desc:0 "A massive 160mm breech-loading heavy mortar built to smash bunkers, street barricades, and dug-in infantry."

 heavy_mortars:0 "Heavy Mortar Company"
 heavy_mortars_desc:0 "A regimental heavy mortar company delivering high-angle indirect fire to suppress defenders and clear fortified or urban terrain."

 category_heavy_mortars:0 "Heavy Mortars"
 cat_heavy_mortars:0 "Heavy Mortars"

