 # --- NEW GRAND DOCTRINES (AIR & NAVAL) ---
 GRAND_DOCTRINE_AIR_DENIAL:0 "Integrated Air Denial"
 GRAND_DOCTRINE_AIR_DENIAL_DESC:0 "§RReserved for Major Powers only.§! Dominate homeland airspace, shred enemy bombers, and punish surface fleets with maritime air strikes.\n§GGrand Doctrine Mastery Synergy:§! +15% Fighter & Strike Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Fighters: Interceptor Wall, Homeland Defense, Dogfighting Mastery\n- Strike: Armored Column Hunters, Naval Strike Tactics, Naval Torpedo Tactics\n- Medium: Night Intruder Wings, Bomber Interception, Aerial Reconnaissance\n- Heavy: Maritime Patrol Bombers, Coastal Air Patrol, Open Ocean Air Patrol"
 GRAND_DOCTRINE_LITTORAL_AMBUSH:0 "Jeune École & Littoral Ambush"
 GRAND_DOCTRINE_LITTORAL_AMBUSH_DESC:0 "High-speed night torpedo flotillas, fast raiding cruisers, escort carriers, and stealthy coastal submarines built to shatter superior battlelines.\n§GGrand Doctrine Mastery Synergy:§! +15% Screens & Submarines Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Capital: Fast Surface Flotillas, Battlecruiser Supremacy, Armored Raiders\n- Carriers: Escort Carrier Hunters, Light Task Forces, Floating Airfields\n- Screens: Night Torpedo Flotillas, Torpedo Primacy, Hunter-Killers\n- Submarines: Littoral Ambush Submarines, Coastal Defense, Wolfpacks"

