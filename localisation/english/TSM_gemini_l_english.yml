 # --- 4 BRAND-NEW GRAND DOCTRINES ---
 GRAND_DOCTRINE_COMBINED_ARMS_SHOCK:0 "Combined Arms Shock"
 GRAND_DOCTRINE_COMBINED_ARMS_SHOCK_DESC:0 "Violent combined-arms breakthroughs uniting heavy tanks, stormtroopers, assault guns, and combat pioneers.\n§GGrand Doctrine Mastery Synergy:§! +15% Armor & Combat Support Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Infantry: Stormtrooper Assault, Assault Infantry, Commandos\n- Combat Support: Assault Gun Batteries, Fire Concentration, Flying Batteries\n- Armor: Heavy Breakthrough Battalions, Armored Spearhead, Armored Advance\n- Motorized: Panzergrenadier Assault, Mobile Infantry, Armored Cavalry\n- Support: Assault Pioneers, Self-Propelled Support, Armored Infantry Support\n- Operations: Shock Army Operations, Rapid Domination, Infiltration Tactics"
 GRAND_DOCTRINE_ASYMMETRIC_ATTRITION:0 "Fortress & Counter-Offensive"
 GRAND_DOCTRINE_ASYMMETRIC_ATTRITION_DESC:0 "Bleed enemy spearheads dry on fortified lines, flak & AT umbrellas, and elastic defenses before launching lethal armored counter-encirclements.\n§GGrand Doctrine Mastery Synergy:§! +15% Support & Operations Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Infantry: Iron Curtain Defense, Defensive Postures, Commandos\n- Combat Support: Integrated Flak & AT Umbrella, Anti-Tank Frontline, Siege Artillery\n- Armor: Cruiser Tank Raiders, Tank Destroyer Force, Armored Advance\n- Motorized: Motorized Fire Brigades, Mobile Defense, Armored Cavalry\n- Support: Theater Logistics & Signals, Field Engineering, Mobile Recon & Assault\n- Operations: Elastic Counter-Encirclement, Defense in Depth, Infiltration Tactics"
 GRAND_DOCTRINE_AIR_DENIAL:0 "Integrated Air Denial"
 GRAND_DOCTRINE_AIR_DENIAL_DESC:0 "§RReserved for Major Powers only.§! Dominate homeland airspace, shred enemy bombers, and punish surface fleets with maritime air strikes.\n§GGrand Doctrine Mastery Synergy:§! +15% Fighter & Strike Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Fighters: Interceptor Wall, Homeland Defense, Dogfighting Mastery\n- Strike: Armored Column Hunters, Naval Strike Tactics, Naval Torpedo Tactics\n- Medium: Night Intruder Wings, Bomber Interception, Aerial Reconnaissance\n- Heavy: Maritime Patrol Bombers, Coastal Air Patrol, Open Ocean Air Patrol"
 GRAND_DOCTRINE_LITTORAL_AMBUSH:0 "Jeune École & Littoral Ambush"
 GRAND_DOCTRINE_LITTORAL_AMBUSH_DESC:0 "High-speed night torpedo flotillas, fast raiding cruisers, escort carriers, and stealthy coastal submarines built to shatter superior battlelines.\n§GGrand Doctrine Mastery Synergy:§! +15% Screens & Submarines Track Mastery Gain.\n§YUnlocked Subdoctrine Pool:§!\n- Capital: Fast Surface Flotillas, Battlecruiser Supremacy, Armored Raiders\n- Carriers: Escort Carrier Hunters, Light Task Forces, Floating Airfields\n- Screens: Night Torpedo Flotillas, Torpedo Primacy, Hunter-Killers\n- Submarines: Littoral Ambush Submarines, Coastal Defense, Wolfpacks"

