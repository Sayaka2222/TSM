l_english:
 ARTILLERY_TITLE_INFANTRY_SUPPORT_GUNS:0 "INFANTRY GUNS"

 infantry_support_guns_1:0 "Light Infantry Support Guns"
 infantry_support_guns_1_desc:0 "Lightweight, man-portable direct-fire guns organic to infantry regiments, offering immediate close-support firepower against strongpoints and machine-gun nests."
 infantry_support_guns_2:0 "Improved Infantry Support Guns"
 infantry_support_guns_2_desc:0 "Heavier short-barreled infantry howitzers and reinforced carriages capable of demolishing fortified positions in direct support of advancing riflemen."
 infantry_support_guns_3:0 "Direct-Fire Support Tactics"
 infantry_support_guns_3_desc:0 "Dedicated forward observation, rapid limbering drills, and specialized high-explosive rounds that tighten coordination between infantry squads and accompanying gun crews."
 infantry_support_guns_4:0 "Heavy Infantry Support Guns"
 infantry_support_guns_4_desc:0 "Lightweight high-impulse and recoilless infantry cannons combining heavy shell performance with low carriage weight."
 infantry_support_guns_5:0 "Shaped-Charge Infantry Munitions"
 infantry_support_guns_5_desc:0 "Hollow-charge HEAT projectiles allowing close-support infantry guns to defeat medium and heavy armored vehicles at close range."

 infantry_support_gun_equipment:0 "Infantry Support Guns"
 infantry_support_gun_equipment_short:0 "Inf. Guns"
 infantry_support_gun_equipment_desc:0 "Light, direct-fire artillery pieces operated at the regimental and battalion level to accompany advancing infantry."
 infantry_support_gun_equipment_1:0 "Light Infantry Support Gun"
 infantry_support_gun_equipment_1_short:0 "Inf. Gun I"
 infantry_support_gun_equipment_1_desc:0 "A compact 75mm infantry gun designed to be manhandled alongside frontline infantry companies."
 infantry_support_gun_equipment_2:0 "Improved Infantry Support Gun"
 infantry_support_gun_equipment_2_short:0 "Inf. Gun II"
 infantry_support_gun_equipment_2_desc:0 "A heavier close-support infantry howitzer delivering substantially greater blast and breakthrough punch."
 infantry_support_gun_equipment_3:0 "Heavy Infantry Support Gun"
 infantry_support_gun_equipment_3_short:0 "Inf. Gun III"
 infantry_support_gun_equipment_3_desc:0 "A late-war recoilless or light-alloy infantry gun firing high-explosive and shaped-charge rounds."

 infantry_support_guns:0 "Infantry Support Guns"
 infantry_support_guns_desc:0 "A regimental close-support gun company providing immediate direct-fire artillery support to infantry formations."
 infantry_support_gun_brigade:0 "Infantry Gun Battalion"
 infantry_support_gun_brigade_desc:0 "A dedicated line battalion of light infantry support guns that accompanies infantry assaults with direct-fire support and minimal terrain penalties."

 category_infantry_support_guns:0 "Infantry Support Guns"
 cat_infantry_support_guns:0 "Infantry Support Guns"

