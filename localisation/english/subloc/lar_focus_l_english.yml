l_english:
 FRA_Invest_in_rearmament:1 "Develop the Colonies"
 FRA_Invest_in_rearmament_desc:0 "Our industrial heartlands in Europe don't have the population and resources to sustain a large industrial expansion. If our economy is to be competitive with the rest of the world, we must utilize our colonies."
 FRA_dockyard_shit:0 "For every core state that has a dockyard we will gain 2 dockyards after we capitulate"
 POR_elastic_defense:0 "Elastic Defense"
 POR_elastic_defense_desc:0 "Our borders are too extensive to defend. We should follow the same strategy that served us well against the French invasion during the Napoleonic Wars and retreat to Lisbon."
