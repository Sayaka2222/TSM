l_english:
 ship_152_battery:0 "6" Cannon"
 ship_152_battery_short:0 "6" Battery"
 ship_152_battery_desc:0 "High-rate cruiser gun optimized for volume of fire and fire control dominance. Shreds destroyers and light cruisers but lacks punch against armored targets."
 ship_183_battery:0 "7.2" Cannon"
 ship_183_battery_short:0 "7.2" Battery"
 ship_183_battery_desc:0 "Experimental “overmatch” cruiser caliber meant to fight standard cruisers with superior shell weight. Powerful on paper, impractical in reality due to recoil, weight, and logistics."
 ship_203_battery:0 "8" Cannon"
 ship_203_battery_short:0 "8" Battery"
 ship_203_battery_desc:0 "Treaty heavy-cruiser standard balancing range, penetration, and sustainability. Effective against cruisers, marginal against capital ships, and the most mature cruiser gun caliber."
 ship_234_battery:0 "9.2" Cannon"
 ship_234_battery_short:0 "9.2" Battery"
 ship_234_battery_desc:0 "Pre-treaty large-cruiser caliber bridging cruiser and battleship firepower. Excellent penetration for its size but inefficient and quickly eclipsed by true capital-ship guns."
 ship_283_battery:0 "11" Cannon"
 ship_283_battery_short:0 "11" Battery"
 ship_283_battery_desc:0 "A high-caliber gun optimized for large cruisers and commerce raiders. Prioritizes speed, range, and rate of fire over raw shell weight, making it effective against cruisers and convoys while avoiding the weight and complexity of full battleship artillery."
 ship_305_battery:0 "12" Cannon"
 ship_305_battery_short:0 "12" Battery"
 ship_305_battery_desc:0 "A heavy gun suited for large cruisers and surface raiders. Offers solid firepower against cruisers and merchant traffic while remaining lighter, faster-firing, and more flexible than true battleship guns, at the cost of reduced effectiveness against heavily armored capital ships."
 ship_330_battery:0 "13" Cannon"
 ship_330_battery_short:0 "13" Battery"
 ship_330_battery_desc:0 "A heavy naval gun battery sitting in the awkward zone: more punch than standard capital guns, but without the decisive power of true super-heavy calibers."
 ship_ap_shell:0 "Armor-Piercing Shell"
 ship_ap_shell_short:0 "AP Shell"
 ship_ap_shell_desc:0 "Armor-piercing ammunition optimized for heavy armor penetration.§R On receiving a critical hit, this ship risks magazine detonation and catastrophic damage. §!"
 ship_he_shell:0 "High-Explosive Shell"
 ship_he_shell_short:0 "HE Shell"
 ship_he_shell_desc:0 "High-explosive ammunition designed to detonate on impact, causing widespread surface damage and fires.§R On receiving a critical hit, this ship risks magazine detonation and catastrophic damage. §!"
 ship_sap_shell:0 "Semi-Armor-Piercing Shell"
 ship_sap_shell_short:0 "SAP Shell"
 ship_sap_shell_desc:0 "Semi-armor-piercing ammunition designed to penetrate moderate armor and detonate inside the hull.§R On receiving a critical hit, this ship risks magazine detonation and catastrophic damage. §!"
 ship_shap_shell:0 "Super-Heavy-Armor-Piercing Shell"
 ship_shap_shell_short:0 "SHAP Shell"
 ship_shap_shell_desc:0 "Extremely heavy armor-piercing ammunition designed to penetrate the thickest belts at close range.§R On receiving a critical hit, this ship risks magazine detonation and catastrophic damage. §!"
 ship_damage_control:0 "Damage Control"
 ship_damage_control_short:0 "Damage Control"
 ship_damage_control_desc:0 "Improved internal safety procedures and crew training reduce the effects of critical hits, fires, and flooding, increasing a ship’s ability to survive sustained damage."
 ship_pure_oxygen_torpedo:0 "Pure Oxygen Torpedo"
 ship_pure_oxygen_torpedo_short:0 "Pure Oxygen Torpedo"
 ship_pure_oxygen_torpedo_desc:0 "Advanced torpedoes using pure oxygen propulsion, granting exceptional range and speed with a massive explosive charge."
 ship_anti_torpedo_bulge:0 "Pugliese System"
 ship_anti_torpedo_bulge_short:0 "Pugliese System"
 ship_anti_torpedo_bulge_desc:0 "An internal torpedo defense system using a large cylindrical void to absorb blast energy."
 ship_afc_table:0 "Admiralty Fire Control Table"
 ship_afc_table_short:0 "Admiralty Fire Control Table"
 ship_afc_table_desc:0 "Advanced mechanical fire control system enhancing sustained long-range accuracy."
 ship_scheme_mixed:0 "Mixed Armor Scheme"
 ship_scheme_mixed_short:0 "Mixed Armor Scheme"
 ship_scheme_mixed_desc:0 "Early, inefficient protection with armor spread thinly across hull, superstructure, and secondary spaces. Prioritizes broad coverage over thickness, resulting in poor deck protection and high vulnerability to critical hits and magazine explosions. Cheap, steel-heavy, and obsolete by the interwar period."
 ship_scheme_incremental:0 "Distributed Armor Scheme"
 ship_scheme_incremental_short:0 "Distributed Armor Scheme"
 ship_scheme_incremental_desc:0 "Armor thickness increases progressively toward vital spaces, with belts, decks, and internal bulkheads all receiving protection. Still attempts to protect much of the ship, leading to high weight and mediocre efficiency. Transitional doctrine that improves survivability but wastes tonnage."
 ship_scheme_incremental_post_jutland:0 "Improved Distributed Armor"
 ship_scheme_incremental_post_jutland_short:0 "Improved Distributed Armor"
 ship_scheme_incremental_post_jutland_desc:0 "Refined distributed scheme incorporating thicker armored decks, internal slopes, improved subdivision, and anti-flash measures. Focuses on reducing catastrophic losses from plunging fire and magazine detonations. Represents the first truly competent modern armor philosophy."
 ship_scheme_all_or_nothing:0 "All-or-Nothing Armor"
 ship_scheme_all_or_nothing_short:0 "All-or-Nothing Armor"
 ship_scheme_all_or_nothing_desc:0 "Concentrates heavy armor exclusively around machinery and magazines in a compact citadel, leaving non-vital areas largely unarmored. Maximizes survivability per ton and drastically reduces critical hits, at the cost of extensive topside damage. Highly efficient but chromium-intensive."
 ship_scheme_all_or_nothing_armor_citadel:0 "All-or-Nothing (Reinforced Citadel)"
 ship_scheme_all_or_nothing_armor_citadel_short:0 "Advanced All-or-Nothing"
 ship_scheme_all_or_nothing_armor_citadel_desc:0 "An optimized evolution of All-or-Nothing featuring multi-layer armored decks, sloped internal citadel walls, and integrated torpedo defense. Designed to withstand modern heavy shells, air attack, and underwater damage simultaneously. Extremely survivable, extremely expensive."
 ship_355_battery:0 "14" Cannon"
 ship_355_battery_short:0 "14" Battery"
 ship_355_battery_desc:0 "A high-end capital ship gun representing the upper limit of practical naval artillery. Delivers strong penetration and shell weight, but comes with increased weight, slower handling, and rising logistical costs compared to 330–340 mm systems."
 ship_381_battery:0 "15" Cannon"
 ship_381_battery_short:0 "15" Battery"
 ship_381_battery_desc:1 "A true heavy battleship gun and a proven standard of late post Great War fleets. Excellent penetration and destructive power, balanced by high weight, slower reload, and significant strain on ship design and fire control systems."
 ship_406_battery:0 "16" Cannon"
 ship_406_battery_short:0 "16" Battery"
 ship_406_battery_desc:0 "The peak of practical battleship armament. Massive shells deliver decisive penetration and devastating hits, at the cost of extreme weight, slow handling, and heavy demands on ship stability, industry, and fire control."
 ship_457_battery:0 "18" Cannon"
 ship_457_battery_short:0 "18" Battery"
 ship_457_battery_desc:0 "The ultimate evolution of heavy firepower, this heavily armored mount allows for a high degree of accuracy over long distances."
 ship_super_heavy_battery_2:0 "18.1" Cannon"
 ship_super_heavy_battery_2_short:0 "18.1" Battery"
 ship_super_heavy_battery_2_desc:0 "The biggest gun ever mounted on a ship, these massive cannons were designed to penetrate any feasible armor at any distance."
 dp_ship_secondaries_light_1:0 "100mm Dual-Purpose Secondary Battery"
 dp_ship_secondaries_light_1_short:0 "Dual-Purpose Secondary Battery I"
 dp_ship_secondaries_light_1_desc:0 "By combining the duties of the heavy anti-air gun and the secondary battery, this mount drastically boosts the anti-air capabilities of a ship while also providing some measure of defense against smaller surface targets."
 dp_ship_secondaries_light_2:1 "113mm Dual-Purpose Secondary Battery"
 dp_ship_secondaries_light_2_short:1 "Dual-Purpose Secondary Battery II"
 dp_ship_secondaries_light_2_desc:1 "Housing dual purpose secondary guns in a turret greatly increases the crew protection."
 dp_ship_secondaries_light_3:0 "127mm Dual-Purpose Secondary Battery"
 dp_ship_secondaries_light_3_short:0 "Dual-Purpose Secondary Battery III"
 dp_ship_secondaries_light_3_desc:0 "Powered twin dual purpose turrets allow for a large increase in firepower."
 dp_ship_secondaries_light_4:0 "127mm RF. Dual-Purpose Secondary Battery"
 dp_ship_secondaries_light_4_short:0 "Dual-Purpose Secondary Battery IV"
 dp_ship_secondaries_light_4_desc:0 "Created for rapid fire against all forms of target these are the ultimate secondary weapons."
 ship_deck_space_small:0 "Hangar Space"
 ship_deck_space_small_desc:0 "A large open area inside the ship that allows the servicing and arming of wheeled airplanes. Adding further hangar space to a ship dramatically drives up cost."
 ship_armor_shbb2:0 "500mm Belt/250mm Deck"
 ship_armor_shbb2_short:0 "Improved Super-Heavy Armor"
 large_deck_size:0 "Large Deck Size"
