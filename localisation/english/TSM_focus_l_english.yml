 SOV_barb_1:0 "Soviet Women"
 SOV_barb_1_desc:0 "About a million women fought in the Soviet army. They mastered all military specialties, including the most “masculine” ones. A linguistic problem even emerged: no feminine gender had existed till then for the words tank driver, infantryman, machine gunner, because women had never done that work. The feminine forms were born there, in the war … "
