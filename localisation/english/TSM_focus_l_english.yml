 RAJ_indian_national_congress_2:0 "Satyagraha"
 RAJ_indian_national_congress_2_desc:0 "Satyagraha or “holding onto truth” is a form of civil non-violent protest lead and created by Mahatma Gandhi. We must lead by example and encourage the Indian people to practise these truths so we all may become satyagrahi."
 RAJ_indian_national_congress_3:0 "Duragraha"
 RAJ_indian_national_congress_3_desc:0 "Duragraha is the path of violence to achieve a means to an end, we must embrace this new policy in order to accelerate the path to independence. We shall incite revolts and insurgencies to fight for the cause of our independence against the British Imperialists."
