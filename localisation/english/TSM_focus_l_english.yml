 MEX_go_with_britain:0 "Go With Britain"
 MEX_go_with_britain_desc:0 "In the face of adversity, Mexico finds strength in unity. By aligning ourselves with Britain and the Allied cause, we affirm our commitment to freedom, justice, and the defense of our shared values. Together, we stand resolute against the forces of tyranny, forging a bond that will withstand the trials of war and shape the destiny of nations."
 MEX_make_use_of_our_riches:0 "Make Use Of Our Riches"
 MEX_make_use_of_our_riches_desc:0 "We Must make use of our riches, for Mexico has been blessed with abundant natural resources which can be used for the war effort."
 MEX_request_allied_favors:0 "Request Allied Capital"
 MEX_request_allied_favors_desc:0 "As Mexico endeavors to solidify its bonds with the Allied powers, the call for support echoes across the diplomatic corridors. With humility and determination, Mexico requests assistance from its esteemed Allied partners, recognizing the collective strength that comes from shared cooperation. Through this plea for aid, Mexico seeks to fortify its position, enhance its capabilities, and contribute more effectively to the common cause of liberty and peace."
 MEX_american_west_indies_protectorate:0 "Allow American Security In"
 MEX_american_west_indies_protectorate_desc:0 "In a world besieged by threats, Mexico recognizes the value of cooperation and mutual defense. By allowing American security forces into our territory, we affirm our commitment to safeguarding our nation"
 MEX_combined_chiefs_of_staff_representation:0 "Combined Chiefs Of Staff Representation"
 MEX_combined_chiefs_of_staff_representation_desc:0 "Establishing a platform for synchronized military planning, Mexico strides towards unity in strategy. By convening the Combined Chiefs of Staff Representation, Mexico aims to harmonize its military objectives with those of its Allied counterparts."
 MEX_the_fourth_ally:0 "The Fourth Ally"
 MEX_the_fourth_ally_desc:0 "Elevating Mexico to the ranks of esteemed allies on the world stage."
 MEX_zandery_military_airport:0 "Mexican Military Affairs Commission"
 MEX_zandery_military_airport_desc:0 "Establishing the Mexican Military Affairs Commission signifies a pivotal moment in Mexico's military strategy. Through this initiative, Mexico commits to fostering collaboration, coordination, and innovation within its armed forces. The commission serves as a platform for joint planning, resource allocation, and technology exchange, ensuring a unified approach to defense and national security."
 MEX_responsibility_for_our_own_defense:0 "Responsibility For Our Own Defense"
 MEX_responsibility_for_our_own_defense_desc:0 "Embracing the principle of self-reliance, Mexico embarks on a path to assume greater responsibility for its defense. Through 'Responsibility For Our Own Defense,' Mexico asserts its sovereignty and independence in matters of national security."
